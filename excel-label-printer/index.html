<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Label Printer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-container no-print">
        <header>
            <h1>Jewelry Label Printer</h1>
            <p>Upload your Excel sheet to generate and print beautiful labels.</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="drop-zone" id="drop-zone">
                    <div class="icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <p>Drag & Drop your Excel file here or</p>
                    <button class="btn-secondary" id="browse-btn">Browse File</button>
                    <input type="file" id="file-input" accept=".xlsx, .xls" hidden>
                </div>
                <div class="file-info" id="file-info" style="display: none;">
                    <span class="file-name" id="file-name">filename.xlsx</span>
                    <button class="btn-icon" id="remove-file-btn" title="Remove file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>

            <div class="action-section">
                <button class="btn-primary" id="preview-btn" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    Preview & Print Labels
                </button>
            </div>
        </main>
    </div>

    <!-- Modal for Preview -->
    <div class="modal-overlay no-print" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Label Preview</h2>
                <div class="modal-actions">
                    <button class="btn-primary" id="print-btn">Print Now</button>
                    <button class="btn-icon close-modal" id="close-modal-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="labels-grid" id="labels-container">
                    <!-- Labels will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Print area that will actually be printed -->
    <div id="print-area" class="print-area"></div>

    <script src="script.js"></script>
</body>
</html>
