  <!-- CARD 5: WhatsApp Cloud API -->
  <g transform="translate(60, 575)">
    <rect width="460" height="145" rx="20" fill="url(#greenCard)" stroke="#25D366" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#16A34A" />
    <text x="44" y="56" font-size="24" text-anchor="middle">💬</text>
    <text x="80" y="44" font-size="18" fill="#25D366" class="title">Official WhatsApp Cloud API</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">PDF Invoices • Job Cards • Parent Alerts</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Automated customer WhatsApp bots, instant invoice PDF delivery &amp; fee due reminders.</text>
    <rect x="20" y="108" width="135" height="22" rx="6" fill="#25D366" opacity="0.25" />
