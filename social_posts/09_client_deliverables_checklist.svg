<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080811" />
      <stop offset="50%" stop-color="#0F0F1E" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="40%" stop-color="#7C3AED" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 15, 26, 0.95)" />
    </linearGradient>

    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(163, 230, 53, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 15, 26, 0.95)" />
    </linearGradient>

    <linearGradient id="pinkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 46, 147, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 15, 26, 0.95)" />
    </linearGradient>

    <linearGradient id="yellowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 199, 0, 0.18)" />
      <stop offset="100%" stop-color="rgba(15, 15, 26, 0.95)" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Montserrat', 'Inter', -apple-system, sans-serif; font-weight: 900; }
    .sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; }
    .body { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; }
    .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="150" r="220" fill="#FF2E93" opacity="0.18" filter="url(#glow)" />
  <circle cx="950" cy="200" r="240" fill="#06B6D4" opacity="0.18" filter="url(#glow)" />
  <circle cx="540" cy="900" r="260" fill="#7C3AED" opacity="0.2" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="25" y="25" width="1030" height="1030" rx="36" fill="none" stroke="#252538" stroke-width="2" />

  <!-- TOP HEADER -->
  <g transform="translate(60, 65)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#brandGrad)" />
    <text x="30" y="42" font-size="28" fill="#ffffff" text-anchor="middle" class="title">ES</text>
    
    <text x="75" y="28" font-size="22" fill="#FFFFFF" class="title">ERPNext Solution</text>
    <text x="75" y="50" font-size="14" fill="#06B6D4" class="mono">@erpnext_solutions • Official Enterprise Checklist</text>

    <rect x="710" y="6" width="250" height="46" rx="23" fill="#161626" stroke="#A3E635" stroke-width="1.5" />
    <circle cx="735" cy="29" r="6" fill="#A3E635" />
    <text x="752" y="35" font-size="13" fill="#FFFFFF" class="mono">100% INCLUDED IN ERP</text>
  </g>

  <!-- MAIN HEADLINE -->
  <g transform="translate(60, 155)">
    <text x="480" y="35" font-size="34" fill="#FFFFFF" text-anchor="middle" class="title" letter-spacing="-0.5">
      WHAT WE DELIVER TO EVERY CLIENT &amp; ENTERPRISE 🚀
    </text>
    <text x="480" y="68" font-size="16" fill="#A0A0BA" text-anchor="middle" class="body">
      Complete End-to-End Hardware, Cloud Security, KYC &amp; SEO Deliverables Package
    </text>
  </g>

  <!-- 8 CORE DELIVERABLE CARDS (GRID 2x4) -->

  <!-- CARD 1: Google Indexing & SEO -->
  <g transform="translate(60, 245)">
    <rect width="460" height="145" rx="20" fill="url(#cyanCard)" stroke="#06B6D4" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#06B6D4" />
    <text x="44" y="56" font-size="24" text-anchor="middle">🔍</text>
    <text x="80" y="44" font-size="18" fill="#06B6D4" class="title">#1 Google Indexing &amp; SEO</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">Google Search Console • Schema.org JSON-LD</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Guaranteed Googlebot crawler priority indexing, XML sitemaps &amp; top keyword ranking.</text>
    <rect x="20" y="108" width="115" height="22" rx="6" fill="#06B6D4" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#38BDF8" class="mono">VERIFIED LIVE ✓</text>
  </g>

  <!-- CARD 2: Free Lifetime SSL -->
  <g transform="translate(560, 245)">
    <rect width="460" height="145" rx="20" fill="url(#greenCard)" stroke="#A3E635" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#16A34A" />
    <text x="44" y="56" font-size="24" text-anchor="middle">🔒</text>
    <text x="80" y="44" font-size="18" fill="#A3E635" class="title">Lifetime SSL &amp; HTTPS Security</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">256-Bit Encryption • DPDP Act 2023</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Auto-renewing bank-grade SSL padlock, HSTS security headers &amp; zero-data leak guarantees.</text>
    <rect x="20" y="108" width="125" height="22" rx="6" fill="#A3E635" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#A3E635" class="mono">100% SECURED 🔒</text>
  </g>

  <!-- CARD 3: Biometric Attendance -->
  <g transform="translate(60, 410)">
    <rect width="460" height="145" rx="20" fill="url(#pinkCard)" stroke="#FF2E93" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#FF2E93" />
    <text x="44" y="56" font-size="24" text-anchor="middle">🏷️</text>
    <text x="80" y="44" font-size="18" fill="#FF2E93" class="title">Biometric Device Auto-Sync</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">ZKTeco • eSSL • Real-Time Python Daemon</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Live punch-in sync directly into ERPNext HRMS attendance, overtime &amp; payroll calculation.</text>
    <rect x="20" y="108" width="135" height="22" rx="6" fill="#FF2E93" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#FF2E93" class="mono">HARDWARE SYNC ⚡</text>
  </g>

  <!-- CARD 4: UHF RFID Shop-Floor -->
  <g transform="translate(560, 410)">
    <rect width="460" height="145" rx="20" fill="url(#yellowCard)" stroke="#FFC700" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#D97706" />
    <text x="44" y="56" font-size="24" text-anchor="middle">📡</text>
    <text x="80" y="44" font-size="18" fill="#FFC700" class="title">UHF RFID Inventory &amp; Security</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">Shop-Floor Tags • Jewelry &amp; Asset Scan</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Instant multi-tag warehouse scans, anti-theft tracking &amp; automated stock balance ledgers.</text>
