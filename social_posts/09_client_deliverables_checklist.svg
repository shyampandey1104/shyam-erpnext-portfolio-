  <!-- CARD 6: Telephony & Calling -->
  <g transform="translate(560, 575)">
    <rect width="460" height="145" rx="20" fill="url(#cyanCard)" stroke="#FF6B00" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#EA580C" />
    <text x="44" y="56" font-size="24" text-anchor="middle">📞</text>
    <text x="80" y="44" font-size="18" fill="#FF6B00" class="title">Exotel &amp; Twilio Telephony</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">1-Click Calling • In-ERP Call Recording</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Click-to-call inside CRM lead cards, automatic agent call logs &amp; IVR routing flows.</text>
    <rect x="20" y="108" width="130" height="22" rx="6" fill="#FF6B00" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#FF6B00" class="mono">1-CLICK CALLING 🎧</text>
  </g>

  <!-- CARD 7: Govt KYC APIs -->
  <g transform="translate(60, 740)">
    <rect width="460" height="145" rx="20" fill="url(#pinkCard)" stroke="#7C3AED" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#7C3AED" />
    <text x="44" y="56" font-size="24" text-anchor="middle">🆔</text>
    <text x="80" y="44" font-size="18" fill="#C084FC" class="title">Govt KYC APIs (Aadhaar &amp; PAN)</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">Aadhaar OTP • PAN NSDL • Voter ID</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Instant buyer identity verification inside ERP in under 30 seconds with 100% compliance.</text>
    <rect x="20" y="108" width="125" height="22" rx="6" fill="#7C3AED" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#C084FC" class="mono">INSTANT KYC 🛡️</text>
  </g>

  <!-- CARD 8: 24/7 Priority Support -->
  <g transform="translate(560, 740)">
    <rect width="460" height="145" rx="20" fill="url(#greenCard)" stroke="#10B981" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" rx="14" fill="#059669" />
    <text x="44" y="56" font-size="24" text-anchor="middle">🛡️</text>
    <text x="80" y="44" font-size="18" fill="#34D399" class="title">24/7 Priority Emergency Support</text>
    <text x="80" y="68" font-size="13" fill="#E2E8F0" class="sub">&lt;15 Min SLA • Daily Off-Site Backups</text>
    <text x="80" y="90" font-size="12" fill="#94A3B8" class="body">Direct developer hotline for urgent fixes, continuous server monitoring &amp; 99.9% uptime.</text>
    <rect x="20" y="108" width="135" height="22" rx="6" fill="#10B981" opacity="0.25" />
    <text x="28" y="123" font-size="10" fill="#34D399" class="mono">24/7 PRIORITY SLA ⚡</text>
  </g>

  <!-- BOTTOM CALL-TO-ACTION BAR -->
  <g transform="translate(60, 915)">
    <rect width="960" height="95" rx="24" fill="#141424" stroke="url(#brandGrad)" stroke-width="2.5" />
    
    <text x="35" y="42" font-size="18" fill="#FFFFFF" class="title">Ready to Automate Your Business with ERPNext Solution?</text>
    <text x="35" y="68" font-size="13" fill="#A0A0BA" class="body">Custom ERP • Frappe Backend • React UI • WhatsApp &amp; Hardware Integrations</text>

    <!-- WhatsApp CTA Button -->
    <rect x="680" y="22" width="245" height="50" rx="16" fill="#25D366" />
    <text x="802" y="53" font-size="15" fill="#FFFFFF" text-anchor="middle" class="title">WhatsApp: +91 98677 78229</text>
  </g>

</svg>